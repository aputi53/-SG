<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İSG Saha Pro v12.0.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --warning: #eab308; --danger: #dc2626; --dark: #1e293b; --bg: #f1f5f9; --today: #8b5cf6; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #1e293b; }
        .app-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        /* İstatistik Paneli */
        .stats-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-card span { display: block; font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .stat-card b { font-size: 18px; }
        
        .progress-container { background: #e2e8f0; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        #progressBar { background: linear-gradient(90deg, var(--success), #4ade80); height: 100%; width: 0%; transition: 0.5s; }
        
        /* Arama ve Giriş */
        .search-box input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; }
        .input-box { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed #cbd5e1; }
        .input-box input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* Grup ve Firma Kartı */
        .group-header { background: var(--dark); color: white; padding: 10px 15px; border-radius: 10px; margin: 25px 0 10px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .firm-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid #f1f5f9; border-radius: 15px; margin-bottom: 10px; background: white; border-left: 6px solid #cbd5e1; }
        .status-V { border-left-color: var(--success); background: #f0fdf4; }
        .status-K { border-left-color: var(--warning); background: #fefce8; }
        .status-M { border-left-color: var(--danger); background: #fef2f2; }
        
        .name-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .firm-name { font-size: 16px; font-weight: 700; color: #1e293b; flex: 1; }
        
        .firm-note-box { font-size: 13px; color: #475569; background: #f1f5f9; padding: 10px; border-radius: 10px; margin-top: 10px; cursor: pointer; border: 1px solid #e2e8f0; min-height: 20px; }

        /* Butonlar */
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        .btn-small { padding: 10px; font-size: 11px; color: white; min-width: 44px; flex: 1; }
        .v-btn { background: var(--success); }
        .k-btn { background: var(--warning); color: #854d0e; }
        .m-btn { background: var(--danger); }
        .wp-btn { background: #25d366; }
        .mail-btn { background: #f97316; }
        .hist-btn { background: #64748b; padding: 4px 8px; font-size: 10px; }
        .del-btn { background: #fee2e2; color: var(--danger); flex: 0; }

        /* Modallar */
        #modalOverlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; padding:20px; box-sizing: border-box; }
        .custom-modal { background: white; max-width: 500px; margin: 20px auto; padding: 20px; border-radius: 16px; }
        #noteEditorArea { width: 100%; height: 200px; margin-top: 10px; border: 1px solid #ddd; border-radius: 10px; padding: 10px; font-family: inherit; font-size: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="modalOverlay">
    <div class="custom-modal" id="noteModal" style="display:none;">
        <h3 id="noteModalTitle" style="margin-top:0;">📝 Firma Notu</h3>
        <textarea id="noteEditorArea" placeholder="Notunuzu buraya yazın..."></textarea>
        <div style="margin-top:15px; display: flex; gap:10px;">
            <button onclick="saveNote()" style="flex:2; background:var(--success); color:white; padding:12px;">KAYDET</button>
            <button onclick="closeModals()" style="flex:1; background:#ccc; padding:12px;">İPTAL</button>
        </div>
    </div>

    <div class="custom-modal" id="backupModal" style="display:none;">
        <h3 style="margin-top:0;">Veri İşlemi</h3>
        <textarea id="backupText" style="width:100%; height:150px; font-size:10px;"></textarea>
        <button id="copyBtn" onclick="copyToClipboard()" style="background:var(--primary); color:white; width:100%; padding:12px; margin-top:10px;">📋 TÜM KODU KOPYALA</button>
        <button id="loadBtn" onclick="processImport()" style="background:var(--success); color:white; width:100%; padding:12px; margin-top:10px; display:none;">YÜKLE</button>
        <button onclick="closeModals()" style="width:100%; margin-top:10px; background: #eee; padding:10px;">Kapat</button>
    </div>
</div>

<div class="app-container">
    <h2 style="text-align:center; margin-bottom:15px; font-size: 18px;">👷 İSG Saha Pro v12.0.2</h2>
    
    <div class="stats-panel">
        <div class="stat-card"><span>PERFORMANS</span><b id="percCount">%0</b></div>
        <div class="stat-card" style="color:var(--success)"><span>BİTEN</span><b id="doneCount">0</b></div>
        <div class="stat-card" style="color:var(--danger)"><span>KALAN</span><b id="remainCount">0</b></div>
    </div>
    <div class="progress-container"><div id="progressBar"></div></div>
    
    <button onclick="resetMonth()" style="width:100%; background:#fee2e2; color:var(--danger); border:1px solid #fecaca; padding:10px; border-radius:10px; font-size:11px; font-weight:700; margin-bottom:15px;">📅 AYI SIFIRLA VE NOTLARI ARŞİVLE</button>

    <div class="search-box"><input type="text" id="searchInput" onkeyup="render()" placeholder="🔍 Firma veya Grup Ara..."></div>

    <div class="input-box">
        <input type="text" id="fName" placeholder="Firma Adı">
        <input type="text" id="fGroup" list="existingGroups" placeholder="Grup (Örn: 1. GRUP)">
        <datalist id="existingGroups"></datalist>
        <button onclick="addFirm()" style="background:var(--primary); color:white; width:100%; padding:12px;">➕ FİRMA EKLE</button>
    </div>

    <div id="list"></div>

    <div style="margin-top:25px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button onclick="exportData()" style="background:var(--success); color:white; padding:12px;">📊 EXCEL</button>
        <button onclick="openBackup(true)" style="background:#64748b; color:white; padding:10px; font-size:11px;">📋 YEDEKLE</button>
        <button onclick="openBackup(false)" style="background:#64748b; color:white; padding:10px; font-size:11px; grid-column: span 2;">📥 YEDEK YÜKLE</button>
    </div>
</div>

<script>
    let storageKey = 'isg_pro_v11';
    let firms = JSON.parse(localStorage.getItem(storageKey)) || [];
    let archive = JSON.parse(localStorage.getItem('isg_archive')) || {};
    let plannedGroups = JSON.parse(localStorage.getItem('isg_planned')) || [];
    let currentEditId = null;

    function save() { 
        localStorage.setItem(storageKey, JSON.stringify(firms)); 
        localStorage.setItem('isg_archive', JSON.stringify(archive));
    }

    function addFirm(targetGroup = null) {
        const name = targetGroup ? prompt(`${targetGroup} için Firma:`) : document.getElementById('fName').value.trim();
        const group = targetGroup || document.getElementById('fGroup').value.trim();
        if(!name || !group) return;
        firms.push({ id: Date.now(), name, group, status: '', date: '', lastVisitTS: null, note: '', phone: '', email: '' });
        save(); if(!targetGroup) document.getElementById('fName').value = ''; render();
    }

    function resetMonth() {
        if(confirm("Tüm kayıtlar sıfırlanıp arşive alınacak. Emin misiniz?")) {
            firms.forEach(f => { if(f.note) archive[f.id] = f.note; });
            firms = firms.map(f => ({...f, status: '', date: '', lastVisitTS: null, note: ''}));
            save(); render();
        }
    }

    function sendWP(id) {
        const f = firms.find(x => x.id === id);
        const num = prompt("WP Numarası (905...):", f.phone || "90");
        if (num === null) return; // İptal basıldıysa dur
        f.phone = num; save();
        if(num === "90" || !num) return;
        const msg = `Sayın Yetkili,\n\nFirmanıza rutin İş Güvenliği ziyareti gerçekleştirilmiştir.\n\nİyi çalışmalar dileriz.\n\n*Abdurrahman PEHLİVAN*\nA Sınıfı İş Güv. Uzm.\n_AREL OSGB_`;
        window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
        render();
    }

    function sendMail(id) {
        const f = firms.find(x => x.id === id);
        const mail = prompt("E-Posta:", f.email || "");
        if (mail === null) return; // İptal basıldıysa dur
        f.email = mail; save();
        if(!mail) return;
        setStatus(id, 'M', false);
        const body = `Sayın Yetkili,\n\nFirmanıza rutin İş Güvenliği saha ziyareti için gelinmiş ancak ilgili kişilere ulaşılamamıştır.\n\nBilgilerinize sunar, iyi çalışmalar dileriz.\n\nAbdurrahman PEHLİVAN\nA Sınıfı İş Güv. Uzm.\nAREL OSGB`;
        window.location.href = `mailto:${mail}?subject=ISG Saha Ziyareti&body=${encodeURIComponent(body)}`;
        render();
    }

    function openNote(id) {
        currentEditId = id;
        const f = firms.find(x => x.id === id);
        document.getElementById('noteModalTitle').innerText = f.name + " - Not";
        document.getElementById('noteEditorArea').value = f.note || "";
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('noteModal').style.display = 'block';
    }

    function saveNote() {
        const f = firms.find(x => x.id === currentEditId);
        f.note = document.getElementById('noteEditorArea').value;
        save(); closeModals(); render();
    }

    function setStatus(id, stat, doRender = true) {
        const i = firms.findIndex(f => f.id === id);
        firms[i].status = (firms[i].status === stat) ? '' : stat;
        if(firms[i].status !== '') {
            firms[i].date = new Date().toLocaleDateString('tr-TR');
            firms[i].lastVisitTS = Date.now();
        }
        save(); if(doRender) render();
    }

    function render() {
        const listDiv = document.getElementById('list');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const done = firms.filter(f => f.status !== '').length;
        const total = firms.length;
        const perc = total > 0 ? Math.round((done/total)*100) : 0;
        
        document.getElementById('doneCount').innerText = done;
        document.getElementById('remainCount').innerText = total - done;
        document.getElementById('percCount').innerText = `%${perc}`;
        document.getElementById('progressBar').style.width = perc + '%';
        
        listDiv.innerHTML = '';
        let groups = [...new Set(firms.map(f => f.group))];
        
        // AKILLI SIRALAMA
        groups.sort((a, b) => {
            const fA = firms.filter(f => f.group === a);
            const fB = firms.filter(f => f.group === b);
            const isDoneA = fA.every(f => f.status !== '');
            const isDoneB = fB.every(f => f.status !== '');
            if (isDoneA && !isDoneB) return 1;
            if (!isDoneA && isDoneB) return -1;
            return a.localeCompare(b, undefined, {numeric:true});
        });

        groups.forEach(g => {
            const filtered = firms.filter(f => f.group === g && (f.name.toLowerCase().includes(search) || g.toLowerCase().includes(search)));
            if(filtered.length > 0) {
                listDiv.innerHTML += `<div class="group-header"><span>📂 ${g}</span><button onclick="addFirm('${g}')" style="background:var(--success); color:white; padding:4px 8px; font-size:11px;">➕</button></div>`;
                filtered.forEach(f => {
                    let diff = f.lastVisitTS ? Math.floor((Date.now() - f.lastVisitTS) / 86400000) : -1;
                    let histBtn = archive[f.id] ? `<button class="hist-btn" onclick="alert('GEÇEN AYIN NOTU:\\n${archive[f.id]}')">🕒 ESKİ</button>` : '';
                    
                    listDiv.innerHTML += `
                    <div class="firm-item status-${f.status}">
                        <div class="name-row">
                            <span class="firm-name">${f.name}</span>
                            ${histBtn}
                        </div>
                        <small style="font-size:10px; color:#64748b; margin-top:4px;">${diff === -1 ? 'Gidilmedi' : (diff === 0 ? 'Bugün' : diff + ' gün önce')}</small>
                        <div class="firm-note-box" onclick="openNote(${f.id})">📝 ${f.note || 'Not eklemek için dokun...'}</div>
                        <div class="action-btns">
                            <button class="btn-small wp-btn" onclick="sendWP(${f.id})">WP</button>
                            <button class="btn-small mail-btn" onclick="sendMail(${f.id})">M</button>
                            <button class="btn-small v-btn" onclick="setStatus(${f.id}, 'V')">G</button>
                            <button class="btn-small k-btn" onclick="setStatus(${f.id}, 'K')">K</button>
                            <button class="btn-small m-btn" onclick="setStatus(${f.id}, 'M')">X</button>
                            <button class="btn-small del-btn" onclick="delFirm(${f.id})">🗑️</button>
                        </div>
                    </div>`;
                });
            }
        });
        document.getElementById('existingGroups').innerHTML = groups.map(g => `<option value="${g}">`).join('');
    }

    function delFirm(id) { if(confirm("Silinsin mi?")) { firms = firms.filter(f => f.id !== id); save(); render(); } }
    function closeModals() { document.getElementById('modalOverlay').style.display='none'; document.getElementById('noteModal').style.display='none'; document.getElementById('backupModal').style.display='none'; }
    
    function openBackup(isExport) {
        document.getElementById('modalOverlay').style.display='block';
        document.getElementById('backupModal').style.display='block';
        if(isExport) {
            document.getElementById('backupText').value = JSON.stringify({f:firms, ar:archive});
            document.getElementById('copyBtn').style.display = 'block';
            document.getElementById('loadBtn').style.display = 'none';
        } else {
            document.getElementById('backupText').value = "";
            document.getElementById('copyBtn').style.display = 'none';
            document.getElementById('loadBtn').style.display = 'block';
        }
    }

    function copyToClipboard() {
        const t = document.getElementById('backupText'); t.select();
        document.execCommand('copy'); alert("Yedek kopyalandı!");
    }

    function processImport() {
        try {
            const d = JSON.parse(document.getElementById('backupText').value);
            firms = d.f; archive = d.ar || {}; save(); render(); closeModals();
        } catch(e) { alert("Hatalı veri!"); }
    }

    function exportData() {
        let csv = "GRUP\tFIRMA\tDURUM\tTARIH\tNOT\r\n";
        firms.forEach(f => {
            let s = f.status === 'V' ? 'GIDILDI' : (f.status === 'K' ? 'KIMSE YOK' : (f.status === 'M' ? 'GIDILEMEDI' : 'BEKLIYOR'));
            csv += `${f.group}\t${f.name}\t${s}\t${f.date || '-'}\t${f.note || ''}\r\n`;
        });
        const blob = new Blob([new Uint16Array([0xFEFF, ...Array.from(csv).map(c => c.charCodeAt(0))])], {type:'text/csv;charset=utf-16le'});
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
        link.download = `ISG_Raporu.csv`; link.click();
    }

    render();
</script>
</body>
</html>
