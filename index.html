<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İSG Saha Pro v12.4.1 - Güvenli Takas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --warning: #eab308; --danger: #dc2626; --dark: #1e293b; --bg: #f1f5f9; --today: #8b5cf6; --swap: #0ea5e9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #1e293b; }
        .app-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .today-section { background: #fdf4ff; border: 2px solid #f5d0fe; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .today-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 800; font-size: 13px; color: var(--today); }
        .stats-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-card span { display: block; font-size: 10px; color: #64748b; font-weight: 700; }
        .stat-card b { font-size: 18px; }
        .progress-container { background: #e2e8f0; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        #progressBar { background: linear-gradient(90deg, var(--success), #4ade80); height: 100%; width: 0%; transition: 0.5s; }
        .search-box input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; outline: none; }
        .group-header { padding: 10px 15px; border-radius: 12px; margin: 25px 0 10px 0; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .group-pending { background: var(--dark); color: white; }
        .group-completed { background: var(--success); color: white; }
        .group-auto-planned { background: var(--today) !important; color: white; }
        .group-top-row { display: flex; justify-content: space-between; align-items: center; }
        .group-name-text { font-weight: 700; cursor: pointer; }
        .group-date-input { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 5px; padding: 2px 5px; font-size: 11px; }
        .firm-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid #e2e8f0; border-radius: 15px; margin-bottom: 10px; background: white; border-left: 6px solid #cbd5e1; }
        .status-V { border-left-color: var(--success); background: #f0fdf4; }
        .status-K { border-left-color: var(--warning); background: #fefce8; }
        .action-btns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
        .btn-small { padding: 10px; font-size: 11px; color: white; flex: 1; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; }
        .v-btn { background: var(--success); }
        .k-btn { background: var(--warning); color: #854d0e; }
        .wp-btn { background: #25d366; }
        .del-btn { background: #fee2e2; color: var(--danger); flex: 0; padding: 10px 12px; }
        #modalOverlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; }
        .custom-modal { background: white; max-width: 500px; margin: 20% auto; padding: 20px; border-radius: 20px; width: 90%; }
    </style>
</head>
<body>

<div id="modalOverlay">
    <div class="custom-modal" id="noteModal" style="display:none;">
        <h3>📝 Not Düzenle</h3>
        <textarea id="noteEditorArea" style="width:100%; height:150px; margin-top:10px; padding:10px; border-radius:10px; border:1px solid #ddd;"></textarea>
        <div style="margin-top:15px; display: flex; gap:10px;">
            <button onclick="saveNote()" style="flex:1; background:var(--success); color:white; padding:12px; border-radius:10px; border:none;">KAYDET</button>
            <button onclick="closeModals()" style="flex:1; background:#eee; padding:12px; border-radius:10px; border:none;">İPTAL</button>
        </div>
    </div>
</div>

<div class="app-container">
    <h2 style="text-align:center; margin-bottom:15px;">👷 İSG Saha Pro v12.4.1</h2>
    
    <div class="stats-panel">
        <div class="stat-card"><span>PERFORMANS</span><b id="percCount">%0</b></div>
        <div class="stat-card" style="color:var(--success)"><span>BİTEN</span><b id="doneCount">0</b></div>
        <div class="stat-card" style="color:var(--danger)"><span>KALAN</span><b id="remainCount">0</b></div>
    </div>
    
    <div class="progress-container"><div id="progressBar"></div></div>

    <div id="plannedContainer" class="today-section" style="display:none;">
        <div class="today-title">
            <span>📍 BUGÜNÜN PLANI</span>
            <span id="plannedGroupName" style="font-size:11px; background:var(--today); color:white; padding:2px 8px; border-radius:10px;"></span>
        </div>
        <div id="plannedList"></div>
    </div>

    <div class="search-box"><input type="text" id="searchInput" onkeyup="render()" placeholder="🔍 Firma veya Grup Ara..."></div>

    <div id="list"></div>

    <div class="input-box" style="background:#f8fafc; padding:15px; border-radius:15px; margin-top:20px; border: 1px dashed #cbd5e1;">
        <input type="text" id="fName" placeholder="Firma Adı" style="width:100%; padding:10px; margin-bottom:5px; border-radius:8px; border:1px solid #ddd;">
        <input type="text" id="fGroup" list="existingGroups" placeholder="Grup (Örn: GRUP 1)" style="width:100%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
        <datalist id="existingGroups"></datalist>
        <button onclick="addFirm()" style="background:var(--primary); color:white; width:100%; padding:12px; border-radius:10px; border:none; font-weight:bold;">➕ EKLE</button>
    </div>

    <div style="margin-top:30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="exportData()" style="background:var(--success); color:white; padding:15px; border-radius:12px; border:none; font-weight:bold;">📊 EXCEL AL</button>
        <button onclick="resetMonth()" style="background:#fee2e2; color:var(--danger); padding:15px; border-radius:12px; border:none; font-weight:bold;">📅 AYI SIFIRLA</button>
    </div>
</div>

<script>
    // --- VERİ KURTARMA VE SABİTLEME ---
    const VERSIONS = ['isg_pro_v12_4', 'isg_pro_v12_3', 'isg_pro_v12_2', 'isg_pro_v12', 'isg_pro_v11'];
    const KEY = 'isg_saha_pro_final'; // Artık hep bu isimle kaydedecek
    
    let firms = JSON.parse(localStorage.getItem(KEY));
    
    // Eğer yeni anahtarda veri yoksa, eskileri tara
    if (!firms) {
        for (let oldKey of VERSIONS) {
            let oldData = localStorage.getItem(oldKey);
            if (oldData) {
                firms = JSON.parse(oldData);
                console.log("Veri bulundu ve taşındı: " + oldKey);
                break;
            }
        }
    }
    if (!firms) firms = [];

    let groupDates = JSON.parse(localStorage.getItem('isg_group_dates')) || {};
    let currentEditId = null;

    function save() { 
        localStorage.setItem(KEY, JSON.stringify(firms)); 
        localStorage.setItem('isg_group_dates', JSON.stringify(groupDates));
    }

    // --- AKILLI TAKAS SİSTEMİ ---
    function swapToToday(targetGroup) {
        const todayStr = new Date().toISOString().split('T')[0];
        let currentTodayGroup = Object.keys(groupDates).find(g => groupDates[g] === todayStr);

        if (currentTodayGroup === targetGroup) return;

        const targetOldDate = groupDates[targetGroup] || "";
        groupDates[targetGroup] = todayStr;
        
        if (currentTodayGroup) {
            groupDates[currentTodayGroup] = targetOldDate;
        }
        save(); render();
    }

    function updateGroupDate(groupName, date) {
        groupDates[groupName] = date;
        save(); render();
    }

    function render() {
        const listDiv = document.getElementById('list');
        const planDiv = document.getElementById('plannedList');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const todayStr = new Date().toISOString().split('T')[0];
        
        const done = firms.filter(f => f.status !== '').length;
        document.getElementById('doneCount').innerText = done;
        document.getElementById('remainCount').innerText = firms.length - done;
        document.getElementById('percCount').innerText = `%${firms.length > 0 ? Math.round((done/firms.length)*100) : 0}`;
        document.getElementById('progressBar').style.width = (firms.length > 0 ? (done/firms.length)*100 : 0) + '%';

        listDiv.innerHTML = ''; planDiv.innerHTML = '';
        let groups = [...new Set(firms.map(f => f.group))].sort();
        let hasPlan = false;

        groups.forEach(g => {
            const groupFirms = firms.filter(f => f.group === g);
            const isAllDone = groupFirms.every(f => f.status !== '');
            const plannedDate = groupDates[g] || "";
            const isToday = (plannedDate === todayStr);
            const isOverdue = (plannedDate !== "" && plannedDate < todayStr && !isAllDone);

            const filtered = groupFirms.filter(f => f.name.toLowerCase().includes(search) || g.toLowerCase().includes(search));
            
            if(filtered.length > 0) {
                let statusClass = isAllDone ? 'group-completed' : ((isToday || isOverdue) ? 'group-auto-planned' : 'group-pending');

                listDiv.innerHTML += `
                    <div class="group-header ${statusClass}">
                        <div class="group-top-row">
                            <span class="group-name-text" onclick="editGroupName('${g}')">📂 ${g}</span>
                            <input type="date" class="group-date-input" value="${plannedDate}" onchange="updateGroupDate('${g}', this.value)">
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                             <small style="opacity:0.8">${plannedDate ? '📅 ' + plannedDate : 'Tarihsiz'}</small>
                             ${!isToday ? `<button onclick="swapToToday('${g}')" style="background:white; color:black; border:none; font-size:9px; padding:3px 8px; border-radius:4px; font-weight:bold;">BUGÜNE AL (TAKAS)</button>` : ''}
                        </div>
                    </div>`;
                
                filtered.forEach(f => {
                    let diff = f.lastVisitTS ? Math.floor((Date.now() - f.lastVisitTS) / 86400000) : -1;
                    let card = `
                        <div class="firm-item status-${f.status}">
                            <div style="display:flex; justify-content:space-between;">
                                <b onclick="editFirmName(${f.id})">${f.name}</b>
                                <small style="color:#64748b; font-size:10px;">${diff === -1 ? 'Yeni' : diff + ' gün önce'}</small>
                            </div>
                            <div style="font-size:12px; margin:8px 0; color:#444;" onclick="openNote(${f.id})">
                                ${f.note ? '📝 ' + f.note : '<span style="color:#ccc">+ Not...</span>'}
                            </div>
                            <div class="action-btns">
                                <button class="btn-small v-btn" onclick="setStatus(${f.id}, 'V')">GİTTİM</button>
                                <button class="btn-small k-btn" onclick="setStatus(${f.id}, 'K')">KAPALI</button>
                                <button class="btn-small wp-btn" onclick="sendWP(${f.id})">WP</button>
                                <button class="btn-small del-btn" onclick="delFirm(${f.id})">🗑️</button>
                            </div>
                        </div>`;
                    
                    listDiv.innerHTML += card;
                    if((isToday || isOverdue) && f.status === '' && search === '') {
                        planDiv.innerHTML += card;
                        document.getElementById('plannedGroupName').innerText = g.toUpperCase();
                        hasPlan = true;
                    }
                });
            }
        });
        document.getElementById('plannedContainer').style.display = hasPlan ? 'block' : 'none';
        document.getElementById('existingGroups').innerHTML = groups.map(g => `<option value="${g}">`).join('');
    }

    function addFirm() {
        const name = document.getElementById('fName').value.trim();
        const group = document.getElementById('fGroup').value.trim();
        if(!name || !group) return;
        firms.push({ id: Date.now(), name, group, status: '', note: '', lastVisitTS: null });
        document.getElementById('fName').value = '';
        save(); render();
    }

    function setStatus(id, stat) {
        const f = firms.find(x => x.id === id);
        f.status = (f.status === stat) ? '' : stat;
        if(f.status === 'V') f.lastVisitTS = Date.now();
        save(); render();
    }

    function openNote(id) {
        currentEditId = id;
        const f = firms.find(x => x.id === id);
        document.getElementById('noteEditorArea').value = f.note || "";
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById('noteModal').style.display = 'block';
    }

    function saveNote() {
        const f = firms.find(x => x.id === currentEditId);
        f.note = document.getElementById('noteEditorArea').value;
        save(); closeModals(); render();
    }

    function closeModals() { document.getElementById('modalOverlay').style.display = 'none'; document.getElementById('noteModal').style.display = 'none'; }
    function delFirm(id) { if(confirm("Sil?")) { firms = firms.filter(f => f.id !== id); save(); render(); } }
    function editGroupName(old) { const n = prompt("Grup İsmi:", old); if(n && n !== old) { firms.forEach(f => { if(f.group === old) f.group = n; }); if(groupDates[old]) { groupDates[n] = groupDates[old]; delete groupDates[old]; } save(); render(); } }
    function editFirmName(id) { const f = firms.find(x => x.id === id); const n = prompt("Firma İsmi:", f.name); if(n) { f.name = n; save(); render(); } }
    function resetMonth() { if(confirm("Sıfırla?")) { firms = firms.map(f => ({...f, status: '', note: ''})); save(); render(); } }
    function exportData() { let csv = "Firma;Grup;Durum;Not\n"; firms.forEach(f => { csv += `${f.name};${f.group};${f.status};${f.note}\n`; }); const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Saha_Rapor.csv"; link.click(); }
    function sendWP(id) { const f = firms.find(x => x.id === id); window.open(`https://wa.me/90?text=${encodeURIComponent(f.name + " ziyareti bitti.")}`, '_blank'); }

    render();
</script>
</body>
</html>
