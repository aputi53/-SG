<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İSG Saha Pro v12.8.0 - Emine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --warning: #eab308; --danger: #dc2626; --dark: #1e293b; --bg: #f1f5f9; --today: #8b5cf6; --done-group: #16a34a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #1e293b; }
        .app-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .today-section { background: #fdf4ff; border: 2px solid #f5d0fe; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .today-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 800; color: var(--today); font-size: 13px; }
        .stats-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-card span { display: block; font-size: 10px; color: #64748b; font-weight: 700; }
        .stat-card b { font-size: 18px; }
        .progress-container { background: #e2e8f0; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
        #progressBar { background: linear-gradient(90deg, var(--success), #4ade80); height: 100%; width: 0%; transition: 0.5s; }
        .search-box input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; outline: none; }
        .input-box { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed #cbd5e1; }
        .input-box input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .group-header { padding: 10px 15px; border-radius: 12px; margin: 25px 0 10px 0; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .group-pending { background: var(--dark); color: white; }
        .group-completed { background: var(--done-group); color: white; }
        .group-row-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .group-name-text { cursor: pointer; font-weight: 700; flex: 1; }
        .group-btns { display: flex; gap: 5px; align-items: center; }
        .plan-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }
        .add-btn { background: rgba(255,255,255,0.2); color: white; width: 30px; height: 30px; border-radius: 8px; font-size: 16px; border: 1px solid rgba(255,255,255,0.3); }
        .swap-btn { background: #fff; color: #000; border: none; padding: 4px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; cursor: pointer; }
        .group-date-input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 5px; padding: 2px; font-size: 11px; }
        .firm-item { display: flex; flex-direction: column; padding: 15px; border: 1px solid #e2e8f0; border-radius: 15px; margin-bottom: 10px; background: white; border-left: 6px solid #cbd5e1; }
        .status-V { border-left-color: var(--success); background: #f0fdf4; }
        .status-K { border-left-color: var(--warning); background: #fefce8; }
        .status-M { border-left-color: var(--danger); background: #fef2f2; }
        .name-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .firm-name { font-size: 16px; font-weight: 800; color: #1e293b; text-transform: uppercase; cursor: pointer; flex: 1; }
        .firm-note-box { font-size: 14px; color: #475569; background: #f8fafc; padding: 12px; border-radius: 10px; margin-top: 10px; cursor: pointer; border: 1px solid #e2e8f0; min-height: 20px; }
        .action-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 700; transition: 0.2s; }
        .btn-small { padding: 10px; font-size: 12px; color: white; flex: 1; min-width: 45px; }
        .v-btn { background: var(--success); }
        .k-btn { background: var(--warning); color: #854d0e; }
        .m-btn { background: var(--danger); }
        .wp-btn { background: #25d366; }
        .mail-btn { background: #f97316; }
        .hist-btn { background: #64748b; color: white; padding: 5px 10px; font-size: 11px; margin-left: 5px; }
        .del-btn { background: #fee2e2; color: var(--danger); flex: 0; padding: 10px 15px; }
        #modalOverlay { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; padding:20px; box-sizing: border-box; }
        .custom-modal { background: white; max-width: 500px; margin: 10% auto; padding: 25px; border-radius: 20px; }
        #noteEditorArea, #backupText { width: 100%; height: 250px; margin-top: 15px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 15px; font-family: inherit; font-size: 16px; box-sizing: border-box; outline: none; }
    </style>
</head>
<body>

<div id="modalOverlay">
    <div class="custom-modal" id="noteModal" style="display:none;">
        <h3 id="noteModalTitle" style="margin:0;">📝 Not Düzenle</h3>
        <textarea id="noteEditorArea"></textarea>
        <div style="margin-top:20px; display: flex; gap:10px;">
            <button onclick="saveNote()" style="flex:2; background:var(--success); color:white; padding:15px; border-radius:12px;">KAYDET</button>
            <button onclick="closeModals()" style="flex:1; background:#f1f5f9; padding:15px; border-radius:12px;">KAPAT</button>
        </div>
    </div>
    <div class="custom-modal" id="backupModal" style="display:none;">
        <h3 id="backupTitle">İşlem Seçin</h3>
        <p id="backupDesc" style="font-size:12px; color:#64748b;"></p>
        <textarea id="backupText"></textarea>
        <div style="margin-top:20px; display: flex; flex-direction: column; gap:10px;">
            <button id="backupActionBtn" style="background:var(--primary); color:white; padding:15px; border-radius:12px;">TAMAMLA</button>
            <button onclick="closeModals()" style="background:#f1f5f9; padding:10px; border-radius:12px;">İPTAL</button>
        </div>
    </div>
</div>

<div class="app-container">
    <h2 style="text-align:center; margin-bottom:20px;">👷 İSG Saha Pro v12.8.0</h2>
    <div class="stats-panel">
        <div class="stat-card"><span>PERFORMANS</span><b id="percCount">%0</b></div>
        <div class="stat-card" style="color:var(--success)"><span>BİTEN</span><b id="doneCount">0</b></div>
        <div class="stat-card" style="color:var(--danger)"><span>KALAN</span><b id="remainCount">0</b></div>
    </div>
    <div class="progress-container"><div id="progressBar"></div></div>
    <button onclick="resetMonth()" style="width:100%; background:#fef2f2; color:var(--danger); border:1px solid #fee2e2; padding:12px; border-radius:12px; font-weight:800; margin-bottom:20px;">📅 YENİ AYA GEÇ (ARŞİVLE)</button>
    
    <div id="plannedContainer" class="today-section" style="display:none;">
        <div class="today-title"><span id="plannedHeaderTitle">📍 BUGÜN GİDİLECEK GRUPLAR</span><button onclick="clearPlan()" style="background:none; color:var(--danger); border:1px solid var(--danger); padding:2px 8px; border-radius:5px; font-size:10px;">TEMİZLE</button></div>
        <div id="plannedList"></div>
    </div>

    <div class="search-box"><input type="text" id="searchInput" onkeyup="render()" placeholder="🔍 Ara..."></div>
    <div class="input-box">
        <input type="text" id="fName" placeholder="Firma Adı">
        <input type="text" id="fGroup" list="existingGroups" placeholder="Grup Seç veya Yaz">
        <datalist id="existingGroups"></datalist>
        <button onclick="addFirm()" style="background:var(--primary); color:white; width:100%; padding:12px; border-radius:10px;">➕ LİSTEYE EKLE</button>
    </div>
    <div id="list"></div>
    <div style="margin-top:30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button onclick="exportData()" style="background:var(--success); color:white; padding:15px; border-radius:12px;">📊 EXCEL</button>
        <button onclick="openBulkDateModal()" style="background:var(--today); color:white; padding:15px; border-radius:12px;">📅 EXCEL'DEN TARİH AKTAR</button>
        <button onclick="openBackup(true)" style="background:#64748b; color:white; padding:15px; border-radius:12px;">📋 YEDEĞİ AL</button>
        <button onclick="openBackup(false)" style="background:#475569; color:white; padding:15px; border-radius:12px;">📥 YEDEK YÜKLE</button>
    </div>
</div>

<script>
    const KEY = 'isg_pro_v11'; 
    let firms = JSON.parse(localStorage.getItem(KEY)) || [];
    let archive = JSON.parse(localStorage.getItem('isg_archive')) || {};
    let plannedGroups = JSON.parse(localStorage.getItem('isg_planned_groups')) || [];
    let groupDates = JSON.parse(localStorage.getItem('isg_group_dates')) || {};
    let currentEditId = null;

    function save() { 
        localStorage.setItem(KEY, JSON.stringify(firms)); 
        localStorage.setItem('isg_archive', JSON.stringify(archive));
        localStorage.setItem('isg_planned_groups', JSON.stringify(plannedGroups));
        localStorage.setItem('isg_group_dates', JSON.stringify(groupDates));
    }

    function parseTurkishDate(str) {
        const months = { "ocak":"01","şubat":"02","mart":"03","nisan":"04","mayıs":"05","haziran":"06","temmuz":"07","ağustos":"08","eylül":"09","ekim":"10","kasım":"11","aralık":"12" };
        const p = str.toLowerCase().split(' ');
        if(p.length >= 3) {
            let day = p[0].padStart(2, '0');
            let month = months[p[1]] || '01';
            let year = p[2];
            return `${year}-${month}-${day}`;
        }
        return str;
    }

    function openBulkDateModal() {
        document.getElementById('modalOverlay').style.display='block';
        document.getElementById('backupModal').style.display='block';
        document.getElementById('backupTitle').innerText = "Excel'den Tarih Aktar";
        document.getElementById('backupDesc').innerText = "Excel'den 'Grup' ve 'Tarih' sütunlarını yapıştırın (1 veya 1. Grup fark etmez).";
        const txt = document.getElementById('backupText');
        txt.value = "";
        const btn = document.getElementById('backupActionBtn');
        btn.innerText = "GÜNCELLE";
        btn.onclick = () => {
            const rows = txt.value.split('\n');
            let count = 0;
            const groupsInSystem = [...new Set(firms.map(f => f.group))];
            
            rows.forEach(row => {
                const parts = row.split('\t');
                if(parts.length >= 2) {
                    let gIn = parts[0].trim();
                    let dIn = parseTurkishDate(parts[1].trim());
                    
                    let match = groupsInSystem.find(g => 
                        g.toLowerCase() === gIn.toLowerCase() || 
                        g.toLowerCase() === (gIn + ". grup").toLowerCase() ||
                        g.toLowerCase() === (gIn + " grup").toLowerCase()
                    );
                    
                    if(match && dIn) {
                        groupDates[match] = dIn;
                        const todayStr = new Date().toISOString().split('T')[0];
                        if(dIn === todayStr && !plannedGroups.includes(match)) plannedGroups.push(match);
                        count++;
                    }
                }
            });
            alert(count + " grup güncellendi.");
            save(); render(); closeModals();
        };
    }

    function render() {
        const listDiv = document.getElementById('list');
        const planDiv = document.getElementById('plannedList');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const todayStr = new Date().toISOString().split('T')[0];
        
        const done = firms.filter(f => f.status !== '').length;
        const total = firms.length;
        document.getElementById('doneCount').innerText = done;
        document.getElementById('remainCount').innerText = total - done;
        document.getElementById('percCount').innerText = `%${total > 0 ? Math.round((done/total)*100) : 0}`;
        document.getElementById('progressBar').style.width = (total > 0 ? (done/total)*100 : 0) + '%';
        
        listDiv.innerHTML = ''; planDiv.innerHTML = '';
        let groups = [...new Set(firms.map(f => f.group))];
        
        groups.sort((a, b) => {
            const fA = firms.filter(f => f.group === a);
            const fB = firms.filter(f => f.group === b);
            const isDoneA = fA.every(f => f.status !== '');
            const isDoneB = fB.every(f => f.status !== '');
            if (isDoneA && !isDoneB) return 1; 
            if (!isDoneA && isDoneB) return -1;
            if (!isDoneA && !isDoneB) {
                const dA = groupDates[a] || "9999-99-99";
                const dB = groupDates[b] || "9999-99-99";
                if(dA !== dB) return dA.localeCompare(dB);
            }
            return a.localeCompare(b, undefined, {numeric:true});
        });

        groups.forEach(g => {
            const isPl = plannedGroups.includes(g);
            const gDate = groupDates[g] || "";
            const isToday = (gDate === todayStr);
            const filtered = firms.filter(f => f.group === g && (f.name.toLowerCase().includes(search) || g.toLowerCase().includes(search)));
            const isAllDone = firms.filter(f => f.group === g).every(f => f.status !== '');
            
            if(filtered.length > 0) {
                const statusClass = isAllDone ? 'group-completed' : 'group-pending';
                const header = `<div class="group-header ${statusClass}"><div class="group-row-top"><span class="group-name-text" onclick="editGroupName('${g}')">📂 ${g} ${isAllDone ? '(TAMAM)' : ''}</span><div class="group-btns"><button class="plan-btn" onclick="togglePlan('${g}')" style="background:${isPl?'var(--today)':'rgba(255,255,255,0.2)'}">${isPl ? '★ PLANLI' : '☆ PLAN'}</button><button class="add-btn" onclick="addFirm('${g}')">➕</button></div></div><div style="display:flex; justify-content:space-between; align-items:center;"><input type="date" class="group-date-input" value="${gDate}" onchange="updateGDate('${g}', this.value)">${!isToday && !isAllDone ? `<button class="swap-btn" onclick="swapToToday('${g}')">BUGÜNE AL</button>` : (isToday ? '<span style="font-size:10px; font-weight:bold;">📍 BUGÜNÜN PLANI</span>' : '')}</div></div>`;
                
                let groupCardsHtml = '';
                filtered.forEach(f => {
                    let diff = f.lastVisitTS ? Math.floor((Date.now() - f.lastVisitTS) / 86400000) : -1;
                    let diffText = 'Gidilmedi'; let diffColor = '#64748b'; if(diff !== -1) { diffText = diff === 0 ? 'Bugün' : diff + ' gün önce'; if(diff >= 30) diffColor = 'red'; }
                    let hist = archive[f.id] ? `<button class="hist-btn" onclick="alert('ESKİ NOT:\\n' + archive[${f.id}])">🕒</button>` : '';
                    let card = `<div class="firm-item status-${f.status}"><div class="name-row"><span class="firm-name" onclick="editFirmName(${f.id})">${f.name}</span>${hist}</div><small style="font-size:11px; color:${diffColor}; font-weight:700;">${diffText}</small><div class="firm-note-box" onclick="openNote(${f.id})">${f.note ? '📝 ' + f.note : 'Not...'}</div><div class="action-btns"><button class="btn-small wp-btn" onclick="sendWP(${f.id})">WP</button><button class="btn-small mail-btn" onclick="sendMail(${f.id})">M</button><button class="btn-small v-btn" onclick="setStatus(${f.id}, 'V')">G</button><button class="btn-small k-btn" onclick="setStatus(${f.id}, 'K')">K</button><button class="btn-small m-btn" onclick="setStatus(${f.id}, 'M')">X</button><button class="btn-small del-btn" onclick="delFirm(${f.id})">🗑️</button></div></div>`;
                    groupCardsHtml += card; if((isPl || isToday) && search === '' && f.status === '') planDiv.innerHTML += card; 
                });
                listDiv.innerHTML += header + groupCardsHtml;
            }
        });

        let activePlannedGroup = groups.find(g => (plannedGroups.includes(g) || groupDates[g] === todayStr) && firms.some(f => f.group === g && f.status === ''));
        if (activePlannedGroup) {
            document.getElementById('plannedHeaderTitle').innerText = `📍 ${activePlannedGroup.toUpperCase()}`;
        } else {
            document.getElementById('plannedHeaderTitle').innerText = `📍 BUGÜN GİDİLECEK GRUPLAR`;
        }

        document.getElementById('plannedContainer').style.display = (planDiv.innerHTML !== '' && search === '') ? 'block' : 'none';
        document.getElementById('existingGroups').innerHTML = groups.map(g => `<option value="${g}">`).join('');
    }

    function addFirm(tG = null) { const n = tG ? prompt(`${tG} Firma:`) : document.getElementById('fName').value.trim(); const g = tG || document.getElementById('fGroup').value.trim(); if(!n || !g) return; firms.push({ id: Date.now(), name: n, group: g, status: '', date: '', lastVisitTS: null, note: '', phone: '', email: '', prevVisitTS: null }); save(); render(); }
    function setStatus(id, s) { const i = firms.findIndex(f => f.id === id); const f = firms[i]; if (f.status === s) { f.status = ''; f.date = ''; f.lastVisitTS = f.prevVisitTS || null; } else { if (f.status === '') f.prevVisitTS = f.lastVisitTS; f.status = s; f.date = new Date().toLocaleDateString('tr-TR'); f.lastVisitTS = Date.now(); } save(); render(); }
    function sendWP(id) { const f = firms.find(x => x.id === id); const n = prompt("WP:", f.phone || "90"); if(n) { f.phone = n; save(); window.open(`https://wa.me/${n}?text=${encodeURIComponent("Sayın Yetkili,\n\nİş Güvenliği ziyaret gerçekleştirilmiştir.\n\nİyi çalışmalar.\n\nAbdurrahman PEHLİVAN")}`, '_blank'); render(); } }
    function sendMail(id) { const f = firms.find(x => x.id === id); const m = prompt("E-Posta:", f.email || ""); if(m) { f.email = m; save(); window.location.href = `mailto:${m}?subject=ISG Ziyareti&body=${encodeURIComponent("Sayın Yetkili,\n\n6331 sayılı Kanun kapsamında planlanan ziyaret gerçekleştirilememiştir.")}`; render(); } }
    
    function togglePlan(g) { 
        const todayStr = new Date().toISOString().split('T')[0];
        if(plannedGroups.includes(g)) {
            plannedGroups = plannedGroups.filter(x => x !== g);
            if(groupDates[g] === todayStr) groupDates[g] = "";
        } else {
            for(let k in groupDates) {
                if(groupDates[k] === todayStr) groupDates[k] = "";
            }
            groupDates[g] = todayStr;
            plannedGroups = [g];
        }
        save(); render();
    }
    
    function updateGDate(g, v) { 
        groupDates[g] = v; 
        const todayStr = new Date().toISOString().split('T')[0]; 
        if(v === todayStr) {
            for(let k in groupDates) {
                if(k !== g && groupDates[k] === todayStr) groupDates[k] = "";
            }
            plannedGroups = [g];
        } else {
            plannedGroups = plannedGroups.filter(x => x !== g);
        }
        save(); render(); 
    }
    
    function swapToToday(g) { 
        const todayStr = new Date().toISOString().split('T')[0]; 
        for(let k in groupDates) {
            if(groupDates[k] === todayStr) groupDates[k] = "";
        }
        groupDates[g] = todayStr; 
        plannedGroups = [g]; 
        save(); render(); 
    }
    
    function openNote(id) { currentEditId = id; const f = firms.find(x => x.id === id); document.getElementById('noteEditorArea').value = f.note || ""; document.getElementById('modalOverlay').style.display = 'block'; document.getElementById('noteModal').style.display = 'block'; }
    function saveNote() { const f = firms.find(x => x.id === currentEditId); f.note = document.getElementById('noteEditorArea').value; save(); closeModals(); render(); }
    function resetMonth() { if(confirm("Arşivlensin mi?")) { firms.forEach(f => { if(f.note) archive[f.id] = f.note; f.prevVisitTS = f.lastVisitTS; f.status = ''; f.date = ''; f.note = ''; }); plannedGroups = []; save(); render(); } }
    function closeModals() { document.getElementById('modalOverlay').style.display='none'; document.getElementById('noteModal').style.display='none'; document.getElementById('backupModal').style.display='none'; }
    
    function clearPlan() { 
        plannedGroups = []; 
        const todayStr = new Date().toISOString().split('T')[0];
        for(let g in groupDates) {
            if(groupDates[g] === todayStr) groupDates[g] = "";
        }
        save(); render(); 
    }
    
    function delFirm(id) { if(confirm("Sil?")) { firms = firms.filter(f => f.id !== id); save(); render(); } }
    function editFirmName(id) { const f = firms.find(x => x.id === id); const n = prompt("Firma:", f.name); if(n) { f.name = n; save(); render(); } }
    function editGroupName(o) { const n = prompt("Grup:", o); if(n) { firms.forEach(f => { if(f.group === o) f.group = n; }); plannedGroups = plannedGroups.map(g => g === o ? n : g); save(); render(); } }
    function openBackup(e) { document.getElementById('modalOverlay').style.display='block'; document.getElementById('backupModal').style.display='block'; const btn = document.getElementById('backupActionBtn'); const txt = document.getElementById('backupText'); if(e) { txt.value = JSON.stringify({f:firms, a:archive, p:plannedGroups, d:groupDates}); btn.onclick = () => { txt.select(); document.execCommand('copy'); alert("Kopyalandı!"); }; } else { txt.value = ""; btn.onclick = () => { try { const d = JSON.parse(txt.value); firms = d.f || []; archive = d.a || []; plannedGroups = d.p || []; groupDates = d.d || {}; save(); render(); closeModals(); alert("Yüklendi!"); } catch(e) { alert("Hata!"); } }; } }
    function exportData() { if(firms.length === 0) return; let h = `<html><head><meta charset="utf-8"></head><body><table border="1"><tr><th>Firma</th><th>Grup</th><th>Durum</th><th>Tarih</th><th>Not</th></tr>`; firms.forEach(f => { h += `<tr><td>${f.name}</td><td>${f.group}</td><td>${f.status}</td><td>${f.date}</td><td>${f.note}</td></tr>`; }); h += "</table></body></html>"; const b = new Blob([h], { type: 'application/vnd.ms-excel' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `ISG_Rapor.xls`; a.click(); }
    render();
</script>
</body>
</html>
